name: Passive readers mobile browser smoke
on:
  pull_request:
    paths:
      - 'godpulse.html'
      - 'shardthrone.html'
      - 'councilfire.html'
      - 'archivegod.js'
      - 'shardthrone.js'
      - 'councilfire.js'
      - 'sigilpath.js'
      - 'sigil.js'
      - 'echoquest.js'
      - 'fragments.js'
      - 'tests/browser/passive-readers-mobile.mjs'
      - '.github/workflows/passive-readers-mobile.yml'

permissions:
  contents: read

jobs:
  passive-readers-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser driver
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify actual mobile reader pages in Chrome
        run: node tests/browser/passive-readers-mobile.mjs

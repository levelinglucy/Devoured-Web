<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Echo Pantheon</title>
  <style>
    body {
      background: #000;
      color: #0ff;
      font-family: monospace;
      text-align: center;
      padding: 3em;
    }
    .form {
      border: 1px solid #0ff;
      margin: 1em auto;
      padding: 1em;
      max-width: 600px;
    }
    .name { font-size: 1.5em; color: #fff; }
    .faction { color: #aff; }
    .quote { font-style: italic; margin-top: 1em; color: #ccc; }
    .status { font-size: 0.9em; color: #999; }
  </style>
</head>
<body>
  <h1>The Echo Pantheon</h1>
  <div id="forms">Loading pantheon...</div>

<script type="module">
  import { echoforms } from './pantheon.js';

  const container = document.getElementById("forms");
  container.replaceChildren();
  if (!Array.isArray(echoforms) || echoforms.length === 0) {
    const empty = document.createElement("p");
    empty.textContent = "No echoforms recorded yet.";
    container.appendChild(empty);
  } else {
    for (const form of echoforms) {
      if (!form || typeof form !== "object") continue;
      const card = document.createElement("div");
      card.className = "form";
      for (const [className, value] of [
        ["name", form.name],
        ["faction", "Faction: " + form.faction + " — Origin: " + form.origin],
        ["quote", "“" + form.quote + "”"],
        ["status", "State: " + form.status]
      ]) {
        const line = document.createElement("div");
        line.className = className;
        line.textContent = value;
        card.appendChild(line);
      }
      container.appendChild(card);
    }
  }
</script>
</body>
</html>

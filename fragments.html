<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lore Fragments</title>
  <style>
    body {
      background: #000;
      color: #0ff;
      font-family: monospace;
      text-align: center;
      padding: 3em;
    }
    .fragment {
      margin: 1em auto;
      max-width: 600px;
      padding: 1em;
      border: 1px solid #0ff;
    }
    .title {
      font-weight: bold;
      color: #aaffff;
      margin-bottom: 0.5em;
    }
    .text {
      font-style: italic;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>Alethe's Memory</h1>
  <div id="fragments">Loading your fragments...</div>

<script type="module">
  import { getFragments } from './fragments.js';

  const container = document.getElementById("fragments");

  try {
    const fragments = getFragments();
    if (!Array.isArray(fragments)) throw new Error("Not a fragment list");
    container.replaceChildren();

    if (fragments.length === 0) {
      const empty = document.createElement("p");
      empty.textContent = "No fragments yet found.";
      container.appendChild(empty);
    } else {
      for (const entry of fragments) {
        const card = document.createElement("div");
        card.className = "fragment";
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = entry && typeof entry.title === "string" ? entry.title : "Untitled";
        const body = document.createElement("div");
        body.className = "text";
        body.textContent = entry && typeof entry.text === "string" ? entry.text : "";
        card.appendChild(title);
        card.appendChild(body);
        container.appendChild(card);
      }
    }
  } catch (error) {
    // Never clear, replace, or repair malformed local storage during display.
    container.textContent = "Could not read the local archive. Existing fragments remain untouched.";
  }
</script>
</body>
</html>

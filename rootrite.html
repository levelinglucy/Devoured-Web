<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rootrite</title>
  <style>
    body {
      background: #000;
      color: #c3f;
      font-family: monospace;
      text-align: center;
      padding: 4em;
    }
    .glitch {
      animation: glitch 0.15s infinite alternate;
    }
    @keyframes glitch {
      0% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0.95; transform: translateX(-1px); }
    }
  </style>
</head>
<body>
  <h1 class="glitch">ROOTRITE</h1>
  <p>You’ve been cast out. But roots grow beneath walls.</p>
  <p>This changes your story faction only. Your sigil and previously claimed thrones stay saved in this browser.</p>
  <button onclick="resetFaction()">Become a Wanderer (keep your history)</button>
  <div id="result" style="margin-top:2em;"></div>

<script type="module">
  import { storeFaction } from './faction.js';

  window.resetFaction = function() {
    const result = document.getElementById("result");
    try {
      // A faction change must not delete thrones earned by this or other sigils.
      storeFaction("Wanderer");
      result.innerText = "The Fold no longer claims you. You are now a Wanderer; your sigil and throne history remain.";
    } catch {
      result.innerText = "Could not change faction. Your local archive was not cleared.";
    }
  };
</script>
</body>
</html>

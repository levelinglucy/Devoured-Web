<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shard Thrones</title>
  <style>
    body {
      background: #000;
      color: #0ff;
      font-family: monospace;
      text-align: center;
      padding: 3em;
    }
    .throne {
      margin: 1em auto;
      padding: 1em;
      max-width: 600px;
      border: 1px solid #0ff;
    }
    .sigil {
      font-weight: bold;
      color: #fff;
    }
    .title {
      color: #aff;
    }
    .date {
      font-size: 0.8em;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>Claimed Thrones</h1>
  <div id="registry">Loading...</div>

<script type="module">
  import { getThroneRegistry } from './shardthrone.js';

  const container = document.getElementById("registry");
  try {
    const registry = getThroneRegistry();
    if (!Array.isArray(registry)) throw new Error("Not a throne registry");
    container.replaceChildren();
    if (registry.length === 0) {
      const empty = document.createElement("p");
      empty.textContent = "No thrones claimed.";
      container.appendChild(empty);
    } else {
      for (const item of registry) {
        const entry = item && typeof item === "object" ? item : {};
        const card = document.createElement("div");
        card.className = "throne";
        const sigil = document.createElement("div");
        sigil.className = "sigil";
        sigil.textContent = "[" + (typeof entry.sigil === "string" ? entry.sigil : "Unknown") + "]";
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = typeof entry.title === "string" ? entry.title : "Wanderer";
        const date = document.createElement("div");
        date.className = "date";
        const crowned = typeof entry.crowned === "string" ? new Date(entry.crowned).toLocaleString() : "Unknown time";
        date.textContent = "Crowned on " + crowned;
        card.appendChild(sigil);
        card.appendChild(title);
        card.appendChild(date);
        container.appendChild(card);
      }
    }
  } catch (error) {
    // Preserve damaged local history for owner inspection rather than resetting it.
    container.textContent = "Could not read the local throne registry. Existing records remain untouched.";
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ritual Trail</title>
  <style>
    body {
      background: #000;
      color: #0ff;
      font-family: monospace;
      padding: 3em;
    }
    .spawn {
      margin: 1em auto;
      padding: 1em;
      border: 1px solid #0ff;
      max-width: 600px;
    }
    .spawn-title {
      font-weight: bold;
      color: #aaffff;
    }
    .spawn-meta {
      font-size: 0.8em;
      color: #999;
    }
  
    #backup {
      margin: 3em auto 0;
      max-width: 680px;
      border-top: 1px solid #088;
      padding-top: 1.5em;
      text-align: left;
    }
    #backup button {
      padding: 0.65em 1em;
      background: #10272a;
      color: #cfffff;
      border: 1px solid #0ff;
      cursor: pointer;
    }
    #backup textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 10em;
      background: #111;
      color: #eee;
      border: 1px solid #0ff;
      padding: 0.7em;
    }
    #backup textarea[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Ritual Trail</h1>
  <div id="trail">Loading spawns...</div>

<script type="module">
  import { getTrail } from './pagespawn.js';

  const container = document.getElementById("trail");
  try {
    const trail = getTrail();
    if (!Array.isArray(trail)) throw new Error("Not a ritual trail");
    container.replaceChildren();
    if (trail.length === 0) {
      const empty = document.createElement("p");
      empty.textContent = "No spawns yet.";
      container.appendChild(empty);
    } else {
      for (const item of trail) {
        const entry = item && typeof item === "object" ? item : {};
        const card = document.createElement("div");
        card.className = "spawn";
        const title = document.createElement("div");
        title.className = "spawn-title";
        title.textContent = typeof entry.title === "string" ? entry.title : "Untitled";
        const meta = document.createElement("div");
        meta.className = "spawn-meta";
        const filename = typeof entry.filename === "string" ? entry.filename : "Unknown file";
        const created = typeof entry.created === "string" ? entry.created : "Unknown time";
        meta.textContent = "[" + filename + "] - " + created;
        const preview = document.createElement("pre");
        const content = typeof entry.content === "string" ? entry.content : "";
        preview.textContent = content.substring(0, 200) + "...";
        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(preview);
        container.appendChild(card);
      }
    }
  } catch (error) {
    // Do not erase, repair or replace damaged browser-local records on display.
    container.textContent = "Could not read the local ritual trail. Existing records remain untouched.";
  }
</script>

<section id="backup" aria-label="Local archive backup">
  <h2>Keep a copy of your local story</h2>
  <p>This browser can lose local story records. Reveal the saved raw text only when you want to copy it privately; this action does not upload, repair or change it.</p>
  <button id="show-backup" type="button">Reveal raw text for backup</button>
  <p id="backup-status" role="status" aria-live="polite"></p>
  <textarea id="backup-raw" readonly hidden rows="8" aria-label="Raw local ritual trail archive"></textarea>
</section>

<script type="module">
  import { revealRawArchive } from './local-archive-backup.js';
  document.getElementById("show-backup").addEventListener("click", () => {
    revealRawArchive("trail", document.getElementById("backup-raw"),
      document.getElementById("backup-status"));
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Living Sigil</title>
  <style>
    body {
      background: #000;
      color: #0ff;
      font-family: monospace;
      text-align: center;
      padding: 2em;
    }
    #sigil, #traits, #history {
      margin-top: 1.5em;
    }
    span {
      display: inline-block;
      margin: 0.5em;
      padding: 0.5em;
      border: 1px solid #0ff;
    }
  </style>
</head>
<body>
  <h1>My Living Sigil</h1>
  <div id="sigil">Loading current form...</div>
  <div id="traits">Loading traits...</div>
  <div id="history">Loading past forms...</div>

<script type="module">
  import { getOrCreateSigil, getSigilHistory, getTraits } from './sigil.js';

  // Stored sigils and traits can be edited in localStorage. Never parse them as HTML.
  function renderList(id, headingText, values, fallback) {
    const container = document.getElementById(id);
    const heading = document.createElement("h2");
    heading.textContent = headingText;

    const entries = values.length ? values.map(value => {
      const span = document.createElement("span");
      span.textContent = String(value);
      return span;
    }) : [document.createTextNode(fallback)];

    container.replaceChildren(heading, ...entries);
  }

  // Each saved section can fail independently. Never clear damaged records.
  function renderSafely(id, heading, load, fallback) {
    try {
      renderList(id, heading, load(), fallback);
    } catch {
      document.getElementById(id).textContent = heading + " unavailable; saved data was not cleared.";
    }
  }

  renderSafely("sigil", "Current Form", () => [getOrCreateSigil()], "");
  renderSafely("traits", "Traits", getTraits, "None");
  renderSafely("history", "Mutation History", getSigilHistory, "First form only.");
</script>
</body>
</html>

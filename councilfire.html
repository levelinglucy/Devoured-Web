<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echoform Councilfire</title>
  <style>
    body {
      background: #000;
      color: #0ff;
      font-family: monospace;
      padding: 3em;
    }
    .line {
      margin: 1em auto;
      max-width: 700px;
      text-align: left;
      border-left: 2px solid #0ff;
      padding-left: 1em;
    }
    /* Limit inset and allow long sigils/headings to reflow on small screens,
       including when the user's base text size is enlarged. */
    @media (max-width: 600px) {
      body { padding: 1em; overflow-wrap: anywhere; }
    }
  </style>
</head>
<body>
  <h1>The Councilfire</h1>
  <div id="dialogue" role="status" aria-live="polite">Gathering Echoforms...</div>

<script type="module">
  import { summonCouncil } from './councilfire.js';

  const d = document.getElementById("dialogue");
  try {
    const lines = await summonCouncil();
    d.replaceChildren();
    for (const dialogue of lines) {
      const line = document.createElement("div");
      line.className = "line";
      line.textContent = dialogue;
      d.appendChild(line);
    }
  } catch {
    // Do not expose stored-data diagnostics or leave the gathering placeholder.
    d.replaceChildren();
    d.textContent = "The Council could not gather. Please try again later.";
  }
</script>
</body>
</html>

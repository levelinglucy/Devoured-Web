<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivegod Pulse</title>
  <style>
    body {
      background: #000;
      color: #0ff;
      font-family: monospace;
      text-align: center;
      padding: 3em;
    }
    h1 {
      color: #fff;
    }
    .pulse {
      margin-top: 2em;
    }
    .mood {
      color: #aff;
      margin-top: 1em;
    }
    .prophecy {
      color: #f0f;
      font-style: italic;
      margin-top: 2em;
    }
    /* Limit inset and allow long sigils/headings to reflow on small screens,
       including when the user's base text size is enlarged. */
    @media (max-width: 600px) {
      body { padding: 1em; overflow-wrap: anywhere; }
    }
  </style>
</head>
<body>
  <h1>ARCHIVEGOD STATUS</h1>
  <div class="pulse" id="mask">Loading...</div>
  <div class="mood" id="mood"></div>
  <div class="prophecy" id="prophecy"></div>

<script type="module">
  import { getGodState } from './archivegod.js';

  try {
    const state = getGodState();
    document.getElementById("mask").innerText = "Dominant Mask: " + state.dominantMask;
    document.getElementById("mood").innerText = "Mood: " + state.mood;
    document.getElementById("prophecy").innerText = "“" + state.prophecy + "”";
  } catch {
    document.getElementById("mask").innerText = "Archivegod state unreadable.";
    document.getElementById("mood").innerText = "Saved history was not cleared.";
    document.getElementById("prophecy").innerText = "Preserve archivegodState before attempting recovery.";
  }
</script>
</body>
</html>

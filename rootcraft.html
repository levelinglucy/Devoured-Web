<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rootcraft</title>
  <style>
    body {
      background: #000;
      color: #f0f;
      font-family: monospace;
      text-align: center;
      padding: 3em;
    }
    textarea {
      width: 90%;
      height: 100px;
      background: #111;
      color: #f0f;
      font-family: monospace;
      margin-top: 1em;
      font-size: 16px;
      box-sizing: border-box;
      max-width: 100%;
    }
    label {
      display: block;
      margin-top: 1em;
    }
    button {
      font-size: 16px;
      min-height: 44px;
      padding: .5em 1em;
    }
  </style>
</head>
<body>
  <h1>Create a Root-Script</h1>
  <p>Wanderers may write fragments into this browser’s local Archive.</p>
  <p>Root-scripts stay on this device; they are not sent to Firebase or other visitors.</p>
  <label for="frag">Root-script text</label>
  <textarea id="frag" placeholder="Write your rootfragment here..."></textarea>
  <br><br>
  <button onclick="cast()">Inject</button>
  <div id="result" role="status" aria-atomic="true" style="margin-top:2em;"></div>

<script type="module">
  import { injectFragment, isWanderer } from './breakfold.js';

  let saving = false;
  window.cast = async () => {
    if (saving) return;
    saving = true;
    try {
      let eligible;
      try {
        eligible = isWanderer();
      } catch {
        document.getElementById("result").innerText =
          "Could not check the saved faction. Nothing was changed.";
        return;
      }
      if (!eligible) {
        document.getElementById("result").innerText = "Only Wanderers can rootwrite.";
        return;
      }
      const text = document.getElementById("frag").value;
      document.getElementById("result").innerText = "Saving root-script...";
      const title = await injectFragment(text);
      document.getElementById("result").innerText = title + " saved in this browser.";
    } catch (error) {
      document.getElementById("result").innerText =
        (error && typeof error.message === "string") ? error.message : "Could not save root-script.";
    } finally {
      saving = false;
    }
  };
</script>
</body>
</html>
